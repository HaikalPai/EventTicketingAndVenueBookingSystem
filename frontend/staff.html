<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Venue Staff Dashboard</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Venue Staff Dashboard</h1><p>Student 3 • bookings, checks, audit workflow</p><nav><a href="customer.html">Customer</a><a href="organiser.html">Organiser</a><a href="/docs">Swagger API</a></nav></header><section><h2>Staff sign-in</h2><input id="email" value="staff@demo.example.com"><input id="password" type="password" value="DemoPass123!"><button onclick="login()">Sign in</button><button onclick="logout()">Sign out</button></section><section><h2>Booking operations</h2><button onclick="invoke('/bookings')">All bookings</button><button onclick="invoke('/events')">List events</button><input type="number" id="booking-id" min="1" placeholder="Booking ID"><button onclick="invoke('/bookings/'+document.querySelector('#booking-id').value)">Find booking</button><button onclick="invoke('/bookings/'+document.querySelector('#booking-id').value,'DELETE')">Cancel booking</button><button onclick="invoke('/bookings/'+document.querySelector('#booking-id').value+'/qr')">Verify QR service</button></section><section><h2>Capacity check</h2><input id="event-id" min="1" type="number" placeholder="Event ID"><button onclick="invoke('/events/'+document.querySelector('#event-id').value+'/availability')">Check remaining tickets</button><p>For updates, use Swagger /docs to test PUT with request body and status codes.</p></section><section><h2>API response</h2><pre id="output">Ready.</pre></section><script src="app.js"></script></body></html>
