<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Customer Ticket Portal</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Customer Ticket Portal</h1><p>Student 1 • browse, book, manage tickets</p><nav><a href="organiser.html">Organiser</a><a href="staff.html">Staff</a><a href="/docs">Swagger API</a></nav></header><section><h2>Sign in / register</h2><input id="email" placeholder="Email" value="customer1@demo.example.com"><input id="password" type="password" value="DemoPass123!"><button onclick="login()">Sign in</button><button onclick="logout()">Sign out</button><p>New customer: sign up using Swagger POST /auth/register.</p></section><section><h2>Discover events</h2><input id="search" placeholder="Search event"><button onclick="invoke('/events?search='+encodeURIComponent(document.querySelector('#search').value))">Search events</button><button onclick="invoke('/venues')">Browse venues</button></section><section><h2>Book tickets</h2><form onsubmit="formInvoke(event,'/bookings','POST')"><input type="number" min="1" name="event_id" placeholder="Event ID" required><input type="number" min="1" max="20" name="quantity" placeholder="Number of tickets" required><button>Confirm booking</button></form><button onclick="invoke('/bookings')">My bookings</button><p><input id="booking-id" type="number" min="1" placeholder="Booking ID"><button onclick="invoke('/bookings/'+document.querySelector('#booking-id').value,'DELETE')">Cancel booking</button><button onclick="invoke('/bookings/'+document.querySelector('#booking-id').value+'/qr')">Request QR via external API</button></p></section><section><h2>API response</h2><pre id="output">Ready.</pre></section><script src="app.js"></script></body></html>
