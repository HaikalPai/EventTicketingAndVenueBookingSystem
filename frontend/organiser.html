<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>Event Organiser Console</title><link rel="stylesheet" href="style.css"></head><body><header><h1>Event Organiser Console</h1><p>Student 2 • venue and event management</p><nav><a href="customer.html">Customer</a><a href="staff.html">Staff</a><a href="/docs">Swagger API</a></nav></header><section><h2>Organiser sign-in</h2><input id="email" value="organiser@demo.example.com"><input id="password" type="password" value="DemoPass123!"><button onclick="login()">Sign in</button><button onclick="logout()">Sign out</button></section><section><h2>Create venue</h2><form onsubmit="formInvoke(event,'/venues','POST')"><input name="name" placeholder="Venue name" required><input name="location" placeholder="Location" required><input type="number" name="capacity" placeholder="Capacity" min="1" required><button>Create venue</button></form><button onclick="invoke('/venues')">List venues</button></section><section><h2>Create event</h2><form onsubmit="event.preventDefault(); const f=Object.fromEntries(new FormData(event.target));invoke('/events','POST',{name:f.name,description:f.description,venue_id:Number(f.venue_id),starts_at:new Date(f.starts_at).toISOString(),ticket_limit:Number(f.ticket_limit)})"><input name="name" placeholder="Event name" required><input name="description" placeholder="Description"><input type="number" min="1" name="venue_id" placeholder="Venue ID" required><input type="datetime-local" name="starts_at" required><input type="number" min="1" name="ticket_limit" placeholder="Tickets" required><button>Create event</button></form><button onclick="invoke('/events')">List events</button><p><input type="number" min="1" id="event-id" placeholder="Event ID"><button onclick="invoke('/events/'+document.querySelector('#event-id').value+'/availability')">Check availability</button><button onclick="invoke('/events/'+document.querySelector('#event-id').value,'DELETE')">Delete empty event</button></p></section><section><h2>API response</h2><pre id="output">Ready.</pre></section><script src="app.js"></script></body></html>
